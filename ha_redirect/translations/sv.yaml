configuration:
  target_port:
    name: Destinationsport
    description: Den lokala port som Home Assistant lyssnar på på den här servern.
  listen_ports:
    name: Källportar
    description: Kommaseparerad lista med portar att lyssna på, allihop vidarebefordrade till destinationsporten ovan. Exempel: "80,8080,443,8443,8123". Ogiltiga portar, destinationsporten ovan och eventuella andra portar som redan används av andra processer ignoreras automatiskt.
 
