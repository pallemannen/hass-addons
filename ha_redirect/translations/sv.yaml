configuration:
  forwarders:
    name: Portomstyrningar
    description: Varje omstyrning lyssnar på en eller flera portar, och vidarebefordrar all trafik till en enda server och port.
    fields:
      target_host:
        name: Destinationsserver
        description: Den server som trafiken ska vidarebefordras till - "localhost" eller "127.0.0.1" för Home Assistant, eller valfri annat värdnamn eller IP-adress.
      target_port:
        name: Destinationsport
        description: Den port som destinationsservern lyssnar på.
      source_ports:
        name: Portar att styra om
        description: Komma-separerad lista med portar att lyssna på (till exempel "80, 443, 8443").
