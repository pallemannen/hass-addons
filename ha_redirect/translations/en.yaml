configuration:
  forwarders:
    name: Port forwardings
    description: Each rule listens on one or more ports and relays traffic to a single target host:port.
    fields:
      target_host:
        name: Target Host
        description: Where to relay traffic to - "localhost" for Home Assistant itself, or any other reachable hostname/IP.
      target_port:
        name: Target Port
        description: The port on the target host that actually serves the traffic.
      source_ports:
        name: Source Ports
        description: Comma-separated list of ports to listen on for this rule.
