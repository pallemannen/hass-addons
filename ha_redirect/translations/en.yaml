configuration:
  target_port:
    name: Destination port
    description: The port Home Assistant actually binds to on this host. Always localhost - this add-on runs alongside Home Assistant on the same machine.
  listen_ports:
    name: Listen ports
    description: Comma-separated list of ports to listen on, each forwarded to the destination port (e.g. 80,8080,443,8443,8123). Invalid entries and any port matching the destination port are automatically skipped.
