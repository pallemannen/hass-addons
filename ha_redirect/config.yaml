name: HA Redirect
version: "1.1.0"
slug: ha_redirect
description: Minimal TCP port forwarder for Home Assistant
url: https://github.com/pallemannen/hass-addons/tree/main/ha_redirect
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
options:
  forwarders:
    - target_host: "localhost"
      target_port: 8123
      source_ports: "80,8080,443,8443,8123"
schema:
  forwarders:
    - target_host: str
      target_port: port
      source_ports: str
