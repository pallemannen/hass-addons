name: HA Redirect
version: "1.0.2"
slug: ha_redirect
description: Minimal HTTP/HTTPS redirect to a destination host
url: https://github.com/pallemannen/hass-addons/tree/main/ha_redirect
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ports:
  80/tcp: 80
  8080/tcp: 8080
  443/tcp: 443
  8443/tcp: 8443
  8123/tcp: 8123
map:
  - ssl:ro
options:
  target_host: "homeassistant.local"
  target_port: 8123
  use_ssl: true
schema:
  target_host: str
  target_port: port
  use_ssl: bool
