configuration:
  tsig_algorithm:
    name: TSIG-algoritm
    description: Måste matcha algoritmen för TSIG-nyckeln som är konfigurerad på din DNS-server. Standard: hmac-sha256.
  tsig_keyname:
    name: TSIG-nyckelnamn
    description: Namnet på TSIG-nyckeln enligt konfigurationen på din DNS-server. Standard: ddns-key.
  tsig_secret:
    name: TSIG-hemlighet
    description: Base64-hemligheten (TSIG-nyckeln) konfigurerad på din DNS-server. Inget standardvärde - måste anges.
  fqdn:
    name: Postens FQDN
    description: Posten som denna app uppdaterar. Avslutande punkt krävs inte. Standard: home.dyn.pal.pp.se.
  zone:
    name: Zon
    description: Zonen som posten tillhör, enligt din DNS-servers update-policy. Standard: dyn.pal.pp.se.
  dns_server:
    name: DNS-server
    description: IP-adressen till din DNS-server. Uppdateringar skickas direkt dit över port 53. Inget standardvärde - måste anges.
  ip_echo_url:
    name: IP-echo-URL
    description: En HTTP-endpoint som returnerar anroparens publika IP-adress som ren text. Standard: http://ip.pal.st.
  poll_interval:
    name: Kontrollintervall
    description: Hur ofta, i sekunder, IP-adressen kontrolleras (minst 60). Standard: 900.
