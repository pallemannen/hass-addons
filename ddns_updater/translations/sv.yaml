configuration:
  tsig_algorithm:
    name: TSIG-algoritm
    description: Måste matcha algoritmen för TSIG-nyckeln som är konfigurerad på din BIND-server, t.ex. "hmac-sha256".
  tsig_keyname:
    name: TSIG-nyckelnamn
    description: Namnet på TSIG-nyckeln enligt konfigurationen på din BIND-server.
  tsig_secret:
    name: TSIG-hemlighet
    description: Base64-hemligheten från "tsig-keygen" på din BIND-server.
  fqdn:
    name: Postens FQDN
    description: Posten som denna app uppdaterar, fullt kvalificerad med avslutande punkt, t.ex. "home.dyn.example.com.".
  zone:
    name: Zon
    description: Zonen som posten tillhör, enligt BIND:s update-policy, t.ex. "dyn.example.com".
  bind_server:
    name: BIND-server
    description: IP-adressen till din BIND-server. Uppdateringar skickas direkt dit över port 53.
  ip_echo_url:
    name: IP-echo-URL
    description: En HTTP-endpoint som returnerar anroparens publika IP-adress som ren text.
  poll_interval:
    name: Kontrollintervall
    description: Hur ofta, i sekunder, IP-adressen kontrolleras (minst 60).
